<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>事務作業サポート バナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F2EC;
    --text:#2F2F2F;
    --text-muted:rgba(47,47,47,0.66);
    --accent:#7A8B7A;
    --accent-dark:#637363;
    --accent-soft:rgba(122,139,122,0.16);
    --white:#FFFFFF;
  }

  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;}

  body{
    background:var(--bg);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }

  .banner{
    position:relative;
    width:100%;
    max-width:1180px;
    display:flex;
    align-items:center;
    gap:clamp(32px,6vw,90px);
    padding:clamp(44px,7vw,88px) clamp(24px,5vw,64px);
    overflow:hidden;
  }

  /* ---------- 左：スマホモックアップ ---------- */
  .phone-col{
    position:relative;
    flex:0 0 auto;
    width:clamp(210px,26vw,280px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .blob{
    position:absolute;
    width:340px;
    height:340px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(122,139,122,0.28), rgba(122,139,122,0) 70%);
    filter:blur(6px);
    z-index:0;
  }

  .dot{
    position:absolute;
    border-radius:50%;
    background:var(--accent);
    z-index:2;
  }
  .dot-a{ width:14px; height:14px; top:6%; right:6%; opacity:.7; animation:float 5s ease-in-out infinite; }
  .dot-b{ width:9px; height:9px; bottom:10%; left:2%; opacity:.5; animation:float 4.5s ease-in-out infinite reverse; }

  @keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
  }
  @media (prefers-reduced-motion: reduce){
    .dot-a,.dot-b{ animation:none; }
  }

  .phone{
    position:relative;
    z-index:1;
    width:240px;
    background:var(--text);
    border-radius:34px;
    padding:12px;
    box-shadow:0 30px 60px rgba(47,47,47,0.22), 0 8px 18px rgba(47,47,47,0.14);
  }

  .phone-notch{
    width:56px;
    height:6px;
    background:rgba(255,255,255,0.25);
    border-radius:4px;
    margin:0 auto 8px;
  }

  .screen{
    background:#FBFAF7;
    border-radius:24px;
    padding:18px 16px 20px;
    min-height:440px;
    display:flex;
    flex-direction:column;
  }

  .status-bar{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--text-muted);
    margin-bottom:20px;
    letter-spacing:.02em;
  }

  .app-date{
    display:block;
    font-size:11px;
    color:var(--accent);
    font-weight:500;
    letter-spacing:.05em;
  }

  .app-title{
    font-family:'Shippori Mincho',serif;
    font-size:19px;
    font-weight:600;
    color:var(--text);
    margin:5px 0 16px;
  }

  .task-card{
    background:var(--white);
    border:1px solid rgba(47,47,47,0.08);
    border-radius:16px;
    padding:18px 16px;
    flex:1;
    display:flex;
    flex-direction:column;
  }

  .task-list{
    list-style:none;
    margin:0 0 16px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:13px;
  }

  .task-list li{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:var(--text-muted);
    text-decoration:line-through;
    text-decoration-color:rgba(47,47,47,0.28);
  }

  .check{
    flex:0 0 auto;
    width:19px;
    height:19px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .progress{
    height:6px;
    border-radius:4px;
    background:var(--accent-soft);
    overflow:hidden;
    margin-top:auto;
  }
  .progress-bar{
    width:100%;
    height:100%;
    background:var(--accent);
    border-radius:4px;
  }
  .progress-label{
    font-size:11px;
    font-weight:500;
    color:var(--accent-dark);
    letter-spacing:.03em;
    margin:8px 0 0;
  }

  /* ---------- 右：コピー＆CTA ---------- */
  .content-col{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    text-align:left;
  }

  .headline{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:clamp(32px,4.6vw,52px);
    line-height:1.4;
    letter-spacing:.02em;
    color:var(--text);
    margin:0 0 22px;
  }

  .subcopy{
    font-size:clamp(14px,1.6vw,16px);
    line-height:2;
    color:var(--text-muted);
    max-width:420px;
    margin:0 0 36px;
  }

  .cta-group{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
  }

  .cta-btn{
    border:none;
    cursor:pointer;
    background:var(--accent);
    color:#fff;
    font-family:'Noto Sans JP',sans-serif;
    font-size:16px;
    font-weight:500;
    letter-spacing:.04em;
    padding:17px 42px;
    border-radius:999px;
    box-shadow:0 10px 24px rgba(122,139,122,0.38);
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .cta-btn:hover{
    background:var(--accent-dark);
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(122,139,122,0.45);
  }
  .cta-btn .arrow{
    transition:transform .25s ease;
  }
  .cta-btn:hover .arrow{
    transform:translateX(4px);
  }

  /* 小見出し（個人事業主・フリーランスの方へ） */
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--accent-dark);
    letter-spacing:.08em;
    margin:0 0 18px;
  }
  .eyebrow::before{
    content:"";
    display:inline-block;
    width:14px;
    height:14px;
    background:var(--accent);
    border-radius:3px;
  }

  /* 実績／信頼要素 */
  .trust{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin:28px 0 0;
    padding-top:16px;
    border-top:1px solid rgba(47,47,47,0.14);
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:.04em;
  }
  .trust .trust-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    flex:0 0 auto;
  }

  /* ---------- レスポンシブ ---------- */
  @media (max-width:760px){
    .banner{
      flex-direction:column;
      text-align:center;
      gap:36px;
      padding:44px 24px;
    }
    .content-col{
      align-items:center;
      text-align:center;
    }
    .cta-group{
      align-items:center;
    }
    .subcopy{
      max-width:320px;
    }
    .phone{ width:200px; }
    .screen{ min-height:380px; }
  }
</style>
</head>
<body>

<div class="banner">

  <div class="phone-col">
    <div class="blob"></div>
    <div class="dot dot-a"></div>
    <div class="dot dot-b"></div>
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="screen">
        <div class="status-bar">
          <span>9:41</span>
          <span>●●●</span>
        </div>
        <div class="app-header">
          <span class="app-date">6月19日（金）</span>
          <h3 class="app-title">本日のタスク</h3>
        </div>
        <div class="task-card">
          <ul class="task-list">
            <li><span class="check">✓</span>メール返信</li>
            <li><span class="check">✓</span>請求書作成</li>
            <li><span class="check">✓</span>スケジュール調整</li>
            <li><span class="check">✓</span>タスク管理</li>
          </ul>
          <div class="progress"><div class="progress-bar"></div></div>
          <p class="progress-label">本日の業務 すべて完了</p>
        </div>
      </div>
    </div>
  </div>

  <div class="content-col">
    <span class="eyebrow">個人事業主・フリーランスの方へ</span>
    <h1 class="headline">その事務作業、<br>手放しませんか？</h1>
    <p class="subcopy">メール対応・スケジュール管理・資料作成まで<br>バックオフィス業務をまとめてサポート</p>
    <div class="cta-group">
      <button class="cta-btn">無料相談はこちら<span class="arrow">→</span></button>
    </div>
    <p class="trust"><span class="trust-dot"></span>バックオフィス実務18年以上</p>
  </div>

</div>

</body>
</html>
